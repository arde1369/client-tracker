
logging.level.org.springframework=info

## PostgreSQL
## Would get saved in aws sercrets manager or config server in real world apps
spring.datasource.url=jdbc:postgresql://localhost:5432/client-tracker
spring.datasource.username=postgres
spring.datasource.password=password

# Global Circuit Breaker Settings
circuitbreaker.allBreakersOff=false

# Database Circuit Breaker Settings
circuitbreaker.database.failureRateThreshold=20
circuitbreaker.database.slowCallRateThreshold=20
circuitbreaker.database.waitDurationInOpenState=15
circuitbreaker.database.slowCallDurationThreshold=15
circuitbreaker.database.permittedNumberOfCallsInHalfOpenState=6
circuitbreaker.database.minimumNumberOfCalls=20
circuitbreaker.slidingWindowSize=30

circuitbreaker.database.breakerOff=false
